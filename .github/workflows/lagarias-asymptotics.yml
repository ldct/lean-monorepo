name: Lagarias asymptotic helper

# Independent feedback for this workstream while shared harmonic and finite
# modules are being developed. The full-project helper audit is still required.
on:
  push:
    branches: ['codex/lagarias-formalization']
    paths:
      - '.github/workflows/lagarias-asymptotics.yml'
      - 'v32/playground/Playground/Lagarias/Asymptotics.lean'

permissions:
  contents: read

concurrency:
  group: lagarias-asymptotics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asymptotics:
    name: Asymptotic helper only (not RH equivalence)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: v32/playground
          auto-config: 'false'
          build: 'true'
          build-args: Playground.Lagarias.Asymptotics
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Audit the asymptotic helper's transitive axioms
        working-directory: v32/playground
        run: |
          set -euo pipefail
          audit=$(mktemp ./LagariasAsymptoticsAudit_XXXXXX.lean)
          trap 'rm -f "$audit"' EXIT
          cat > "$audit" <<'LEAN'
          import Playground.Lagarias.Asymptotics
          import Lean.Util.CollectAxioms
          open Lean Elab Command in
          run_cmd do
            let env ← getEnv
            let root := `LeanEval.NumberTheory.Lagarias
            let declarations := env.constants.toList.filter fun entry => root.isPrefixOf entry.1
            if declarations.isEmpty then
              throwError "No asymptotic helper declarations found"
            let allowed := #[``propext, ``Classical.choice, ``Quot.sound]
            for (name, _) in declarations do
              let axioms ← Lean.collectAxioms name
              let forbidden := axioms.filter fun axiomName => !allowed.contains axiomName
              unless forbidden.isEmpty do
                throwError "{name} depends on forbidden axioms: {forbidden}"
            logInfo m!"Audited {declarations.length} asymptotic helper declarations."
          LEAN
          lake env lean "$audit"
