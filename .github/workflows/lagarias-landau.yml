name: Lagarias Landau prerequisites

on:
  pull_request:
    paths:
      - '.github/workflows/lagarias-landau.yml'
      - 'v32/playground/Playground/Lagarias/Landau*.lean'
      - 'v32/playground/lean-toolchain'
      - 'v32/playground/lakefile.toml'
      - 'v32/playground/lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: lagarias-landau-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analytic-prerequisites:
    name: Landau prerequisites (not the RH equivalence)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build with pinned Lean and Mathlib
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: v32/playground
          auto-config: 'false'
          build: 'true'
          build-args: Playground.Lagarias.LandauMGF
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Build and audit each analytic milestone transitively
        working-directory: v32/playground
        run: |
          audit_file="$(mktemp ./LagariasLandauAuditXXXXXX.lean)"
          log_file="$(mktemp ./LagariasLandauLogXXXXXX.txt)"
          trap 'rm -f "$audit_file" "$log_file"' EXIT
          report="$RUNNER_TEMP/lagarias-landau-report.md"
          printf '<!-- lagarias-landau-ci -->\n## Landau analytic CI\n\nCommit `%s` · [run %s](%s/%s/actions/runs/%s).\n\n**These checks do not prove the final RH equivalence.**\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$report"
          append_report() {
            printf '\n### %s: %s\n\n```text\n' "$1" "$2" >> "$report"
            grep -v '^trace: ' "$log_file" | tail -c 10000 >> "$report" || true
            printf '\n```\n' >> "$report"
          }
          failures=0
          for module in Playground.Lagarias.LandauMGF Playground.Lagarias.LandauZeta Playground.Lagarias.LandauContinuation Playground.Lagarias.LandauPoles; do
            if ! lake build "$module" > "$log_file" 2>&1; then
              cat "$log_file"
              append_report "$module" 'compilation failed'
              failures=1
              continue
            fi
            cat "$log_file"
            printf 'import %s\n' "$module" > "$audit_file"
            cat >> "$audit_file" <<'LEAN'
          import Lean.Util.CollectAxioms
          open Lean Elab Command in
          run_cmd do
            let env ← getEnv
            let root := `LeanEval.NumberTheory.Lagarias.Landau
            let declarations := env.constants.toList.filter fun entry => root.isPrefixOf entry.1
            if declarations.isEmpty then
              throwError "Landau audit found no declarations"
            let allowed := #[``propext, ``Classical.choice, ``Quot.sound]
            for (name, _) in declarations do
              let axioms ← Lean.collectAxioms name
              let forbidden := axioms.filter fun axiomName => !allowed.contains axiomName
              unless forbidden.isEmpty do
                throwError "{name} depends on forbidden axioms: {forbidden}"
            logInfo m!"Audited {declarations.length} Landau declarations with only standard axioms."
          LEAN
            if lake env lean "$audit_file" > "$log_file" 2>&1; then
              cat "$log_file"
              append_report "$module" 'compiled and audited'
            else
              cat "$log_file"
              append_report "$module" 'axiom audit failed'
              failures=1
            fi
          done
          exit "$failures"
      - name: Update analytic diagnostic comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lagarias-landau-report.md'
          if not report.exists():
              raise SystemExit(0)
          repo = os.environ['GITHUB_REPOSITORY']
          pr = int(os.environ['PR_NUMBER'])
          base = f'https://api.github.com/repos/{repo}'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def request(path, method='GET', data=None):
              payload = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(base + path, data=payload,
                                           headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          marker = '<!-- lagarias-landau-ci -->'
          comment_id = None
          for page in range(1, 11):
              comments = request(f'/issues/{pr}/comments?per_page=100&page={page}')
              for comment in comments:
                  if (comment['user']['login'] == 'github-actions[bot]'
                          and comment['body'].startswith(marker)):
                      comment_id = comment['id']
                      break
              if comment_id is not None or len(comments) < 100:
                  break
          body = report.read_text(encoding='utf-8')
          if len(body) > 60000:
              body = body[:59000] + '\n\nReport truncated; see the linked workflow log.\n'
          if comment_id is None:
              request(f'/issues/{pr}/comments', 'POST', {'body': body})
          else:
              request(f'/issues/comments/{comment_id}', 'PATCH', {'body': body})
          PY
